# .cnb.yml
# .cnb.yml
include:
  - .cnb/workflows/cnb-custom-env.yml
  - .cnb/workflows/cnb-build-image.yml

# 此定时任务配置在 main 分支下
# 触发时，系统将拉取 main 分支的最新代码进行构建
main:
  # 定时任务配置。用户 A 提交此配置后，任务触发时的执行者即为 A
  # "crontab: 30 5,17 * * *": # 使用 cron 表达式定义执行计划,表示每天在系统时区 (Asia/Shanghai) 的 5:30 AM 和 5:30 PM 各触发一次。
  "crontab: 0 1 * * 5": # 每周五凌晨 1:00 触发
    - name: auto build ubuntu-22.04 # 流水线名称
      services:
        - docker
      stages:
        - name: build-and-push # 任务名称
          script: |
            cd base/ubuntu-22.04
            ./build.sh -b
            ./build.sh -p

            for dir in /workspace/dev-env/*/; do
              cd "$dir"
              echo "current dir is $dir"
              ./build.sh -b
              ./build.sh -p
            done
  push:
    - stages:
        - name: sync to sumumm'github
          image: tencentcom/git-sync
          imports: https://cnb.cool/sumu.k/secret-key/-/blob/main/access-token.yml
          settings:
            target_url: https://github.com/sumumm/docker-images.git
            auth_type: https
            username: sumumm
            password: ${GITHUB_CNB_SYNC}
            force: true
$:
  vscode:
    - docker:
        # 指定开发环境镜像，可以是任意可访问的镜像。
        # 如果 image 指定的镜像中已安装 code-server 代码服务，将使用单容器模式启动开发环境
        # 如果 image 指定的镜像中未安装 code-server 代码服务，将使用双容器模式启动开发环境
        # 如下镜像为 CNB 默认开发环境镜像，已安装代码服务，将使用单容器模式启动开发环境
        # 可按需替换为其他镜像
        image: cnbcool/default-dev-env:latest
        # build:
        #   dockerfile: Dockerfile
          # by:
          #   - common/settings.json
          #   - common/gitconfig
          #   - common/scripts/add-zsh-plugins.sh
          #   - common/scripts/set-zsh-env.sh
      imports:
        - https://cnb.cool/sumu.k/secret-key/-/blob/main/access-token.yml
      services:
        - vscode
        - docker
      # 开发环境启动后会执行的任务
      stages:
        - name: 配置git
          script: |
            git config --global core.editor vim
            git config --global alias.mylog "log --graph --pretty=format:'%C(magenta)[%an]%C(reset) %C(red)%h%C(reset) : %C(green)%s%C(reset) %C(yellow)%d%C(reset) %C(blue)(%cd)%C(reset) ' --abbrev-commit --date=format:'%Y-%m-%d %H:%M:%S'"
            git config --global alias.sync-force '!git fetch origin && git reset --hard "origin/$(git symbolic-ref --short HEAD)"'
